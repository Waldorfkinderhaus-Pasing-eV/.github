name: Full validation on a version tag

# ADR-0022, ADR-0029, D2: the same full validation as the pre-push hook, on a signed version tag on
# main and by hand; never on a pull request. The checks need Python and its standard library only.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  VALIDATE: python scripts/validate.py

jobs:
  guard:
    uses: ./.github/workflows/tag-guard.yml

  validate:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Full validation, the same call as the pre-push hook
        run: $VALIDATE
